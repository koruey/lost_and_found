spring:
  profiles:
    active: dev
  application:
    name: lost-and-found-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8123

# MyBatis Plus
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:/mapper/**/*.xml

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh-CN

# 微信小程序
wx:
  app-id: wx94c3dde0e51b9a4e
  # app-secret 请在 application-secret.yml 中配置

# 管理员配置
admin:
  # password 请在 application-secret.yml 中配置

# JWT
jwt:
  # secret 请在 application-secret.yml 中配置
  expiration: 7200000  # 2小时(毫秒)

# 日志配置
logging:
  charset:
    console: UTF-8
