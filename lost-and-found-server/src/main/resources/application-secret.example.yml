# ==========================================
# 敏感配置文件模板
# 使用方式：复制此文件为 application-secret.yml 并填入真实值
# cp application-secret.example.yml application-secret.yml
# ==========================================

# 微信小程序 AppSecret（微信公众平台 → 开发管理 → 开发设置）
wx:
  app-secret: your-wx-app-secret

# 后台管理登录密码
admin:
  password: admin123

# JWT 签名密钥（建议使用随机字符串，至少32字符）
jwt:
  secret: your-jwt-secret-key-change-me

# MySQL 数据库密码
spring:
  datasource:
    password: your-db-password

# 腾讯云 COS 对象存储密钥（腾讯云控制台 → 访问管理 → API密钥）
cos:
  secret-id: your-cos-secret-id
  secret-key: your-cos-secret-key

# AI API 密钥
ai:
  deepseek:
    api-key: your-deepseek-api-key
